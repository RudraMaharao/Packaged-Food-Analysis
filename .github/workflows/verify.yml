name: Build and verify snapshot

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: python -m pip install -r requirements.txt
      - name: Rebuild MongoDB collections and exports
        run: python build.py --source india_products.csv --mongo mongodb://localhost:27017
      - name: Verify source, exports, and MongoDB counts
        run: python verify.py
